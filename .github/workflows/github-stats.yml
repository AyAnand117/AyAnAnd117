name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p stats

          USER="AyAnand117"

          REPOS=$(gh repo list "$USER" \
            --limit 100 \
            --json name,stargazerCount,forkCount \
            --jq '[.[] | {
              stars: .stargazerCount,
              forks: .forkCount
            }]')

          STARS=$(echo "$REPOS" | jq '[.[].stars] | add // 0')
          FORKS=$(echo "$REPOS" | jq '[.[].forks] | add // 0')

          REPO_COUNT=$(gh repo list "$USER" \
            --limit 100 \
            --json name \
            --jq 'length')

          printf '%s\n' \
            '<svg xmlns="http://www.w3.org/2000/svg" width="700" height="220" viewBox="0 0 700 220">' \
            '<rect width="700" height="220" rx="12" fill="#0d1117"/>' \
            '<text x="40" y="55" fill="#58a6ff" font-size="24" font-family="Arial" font-weight="bold">GitHub Overview</text>' \
            "<text x=\"40\" y=\"105\" fill=\"#ffffff\" font-size=\"18\" font-family=\"Arial\">Repositories: $REPO_COUNT</text>" \
            "<text x=\"40\" y=\"145\" fill=\"#ffffff\" font-size=\"18\" font-family=\"Arial\">Stars: $STARS</text>" \
            "<text x=\"40\" y=\"185\" fill=\"#ffffff\" font-size=\"18\" font-family=\"Arial\">Forks: $FORKS</text>" \
            '</svg>' \
            > stats/github-overview.svg

      - name: Commit generated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add stats/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update GitHub stats"
            git push
          fi
